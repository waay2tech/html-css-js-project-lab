<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

  <body>
    <a class="skip" href="#main">Skip to lesson</a>
    <header class="site-header">
      <a class="brand" href="../../index.html"
        >waay2tech<span>Project Lab · Episode 15</span></a
      ><button id="theme" class="secondary" aria-label="Switch theme">
        Theme
      </button>

    <main id="main" class="shell">
      <div class="intro">
        <div>
          <h1>Learning progress</h1>
          <p>State boundaries, progress and disabled controls.</p>
        </div>
        <a href="./README.md">Lesson notes</a>
      </div>
      <div class="sheet stage" data-ui>
        <ol class="steps" aria-label="Project milestones">
          <li id="step-0">Plan</li>
          <li id="step-1">Structure</li>
          <li id="step-2">Style</li>
          <li id="step-3">Review</li>

        <progress
          id="progress"
          value="1"
          max="4"
          aria-label="Current milestone"

        <div class="panel">
          <h2 id="step-title">Plan</h2>
          <p id="step-copy"></p>
        </div>
        <div class="row">
          <button id="previous" class="secondary">Previous</button
          ><button id="next">Next</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">
          Ready.
        </p>
      </div>
      <noscript
        ><p class="note">
          This lesson’s interactive controls need JavaScript. The static content
          remains readable.
        </p></noscript
