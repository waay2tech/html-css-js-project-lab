<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Intl date/time formatting, time zones and deriving display from Date."
    />
    <title>World clock — Waay2tech Project Lab</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./script.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to lesson</a>
    <header class="site-header">
      <a class="brand" href="../../index.html"
        >waay2tech<span>Project Lab · Episode 21</span></a
      ><button id="theme" class="secondary" aria-label="Switch theme">
        Theme
      </button>
    </header>
    <main id="main" class="shell">
      <div class="intro">
        <div>
          <h1>World clock</h1>
          <p>
            Intl date/time formatting, time zones and deriving display from
            Date.
          </p>
        </div>
        <a href="./README.md">Lesson notes</a>
      </div>
      <div class="sheet stage" data-ui>
        <div class="two">
          <div>
            <label for="timezone">Time zone</label
            ><select id="timezone">
              <option value="Asia/Kolkata">India — Kolkata</option>
              <option value="UTC">UTC</option>
              <option value="Europe/London">London</option>
              <option value="America/New_York">New York</option>
            </select>
            <p></p>
            <button id="format" class="secondary">Use 24-hour time</button>
            <p class="muted">
              The display is derived from the current Date on each tick.
            </p>
          </div>
          <div class="panel">
            <time id="clock" class="clock" aria-live="off"></time>
            <p id="date"></p>
          </div>
        </div>
      </div>
      <noscript
        ><p class="note">
          This lesson’s interactive controls need JavaScript. The static content
          remains readable.
        </p></noscript
      >
    </main>
