<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Filtering into a native listbox; keyboard support without inventing an incomplete ARIA combobox."
    />
    <title>Find a topic — Waay2tech Project Lab</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./script.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to lesson</a>
    <header class="site-header">
      <a class="brand" href="../../index.html"
        >waay2tech<span>Project Lab · Episode 13</span></a
      ><button id="theme" class="secondary" aria-label="Switch theme">
        Theme
      </button>
    </header>
    <main id="main" class="shell">
      <div class="intro">
        <div>
          <h1>Find a topic</h1>
          <p>
            Filtering into a native listbox; keyboard support without inventing
            an incomplete ARIA combobox.
          </p>
        </div>
        <a href="./README.md">Lesson notes</a>
      </div>
      <div class="sheet stage" data-ui>
        <div class="two">
          <div>
            <div class="field">
              <label for="search">Search learning topics</label
              ><input
                id="search"
                type="search"
                value=""
                autocomplete="off"
                aria-controls="topics"
              />
            </div>
            <label for="topics">Matching topics</label
            ><select id="topics" size="5" aria-describedby="status"></select>
          </div>
          <div class="panel">
            <h2>Your topic</h2>
            <output id="selected-topic" class="result">—</output>
            <p id="status" class="status" role="status" aria-live="polite">
              Choose a topic.
            </p>
          </div>
        </div>
      </div>
      <noscript
        ><p class="note">
          This lesson’s interactive controls need JavaScript. The static content
          remains readable.
        </p></noscript
      >
    </main>
    <footer class="site-footer">
      <a href="../12-star-rating/index.html">Previous lesson</a
      ><a href="../../index.html">All 40 lessons</a
      ><a href="../14-accessible-tabs/index.html">Next lesson</a
      ><a href="./CREDITS.md">Credits</a>
    </footer>
  </body>
</html>
