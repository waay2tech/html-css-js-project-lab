<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Pure conversion function, numeric parsing and absolute-zero validation."
    />
    <title>Temperature converter — Waay2tech Project Lab</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./script.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to lesson</a>
    <header class="site-header">
      <a class="brand" href="../../index.html"
        >waay2tech<span>Project Lab · Episode 10</span></a
      ><button id="theme" class="secondary" aria-label="Switch theme">
        Theme
      </button>
    </header>
    <main id="main" class="shell">
      <div class="intro">
        <div>
          <h1>Temperature converter</h1>
          <p>
            Pure conversion function, numeric parsing and absolute-zero
            validation.
          </p>
        </div>
        <a href="./README.md">Lesson notes</a>
      </div>
      <div class="sheet stage" data-ui>
        <form id="converter" class="two">
          <div>
            <div class="field">
              <label for="temperature">Temperature</label
              ><input
                id="temperature"
                type="number"
                value="0"
                step="any"
                required
              />
            </div>
            <label for="unit">Convert from</label
            ><select id="unit">
              <option value="C">Celsius (°C)</option>
              <option value="F">Fahrenheit (°F)</option>
            </select>
            <p></p>
            <button id="convert">Convert</button>
          </div>
          <div class="panel">
            <h2>Converted value</h2>
            <output id="converted" class="result" for="temperature unit"
              >—</output
            >
            <p id="status" class="status" role="status" aria-live="polite">
              Enter a value to convert.
            </p>
          </div>
        </form>
      </div>
      <noscript
        ><p class="note">
          This lesson’s interactive controls need JavaScript. The static content
          remains readable.
        </p></noscript
      >
    </main>
    <footer class="site-footer">
      <a href="../09-character-counter/index.html">Previous lesson</a
      ><a href="../../index.html">All 40 lessons</a
      ><a href="../11-random-choice/index.html">Next lesson</a
      ><a href="./CREDITS.md">Credits</a>
    </footer>
  </body>
</html>
